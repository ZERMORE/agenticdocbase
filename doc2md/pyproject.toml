[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-doc2md"
version = "0.1.0"
description = "Local multimodal document to Markdown pipeline"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24,<2", "Pillow>=10,<13", "httpx>=0.27,<1",
  "python-dotenv>=1,<2", "python-docx>=1.1,<2", "python-pptx>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
doc2md = "doc2md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.test-tmp"
