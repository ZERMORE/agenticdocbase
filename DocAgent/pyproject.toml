[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-docagent"
version = "0.1.0"
requires-python = ">=3.11"
description = "Evidence-grounded DeepSeek agent for local DocBase"
dependencies = ["httpx>=0.27,<1", "python-dotenv>=1,<2", "pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
docagent = "docagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.test-tmp"
